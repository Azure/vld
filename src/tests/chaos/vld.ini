;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;;  Visual Leak Detector - Initialization/Configuration File (test config)
;;
;;  Shared by the chaos tests. SkipCrtStartupLeaks makes leak queries and
;;  heap-destroy reports resolve call stacks with dbghelp.
;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Options]
VLD = on
ReportTo = stdout
StackWalkMethod = fast
SkipCrtStartupLeaks = yes
AggregateDuplicates = no
