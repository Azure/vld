;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;;  Visual Leak Detector - Initialization/Configuration File (test config)
;;
;;  Shared by the review74 tests. ReviewIgnoredLeaker is the function
;;  review_symbol_cache_latch leaks from; no other test uses that name.
;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Options]
VLD = on
ReportTo = stdout
StackWalkMethod = fast
SkipCrtStartupLeaks = yes
AggregateDuplicates = no
IgnoreFunctionsList = ReviewIgnoredLeaker
